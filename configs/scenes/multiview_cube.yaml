schema_version: 2
scene:
  name: multiview_cube
  objects:
    - type: box
      size_m: [0.6, 0.6, 0.6]
      translation_m: [0.65, 0.65, 1.0]
      color_mode: coordinate
      color_rgb: [200, 60, 50]
    - type: sphere
      radius_m: 0.18
      translation_m: [1.5, 1.15, 1.4]
      color_rgb: [30, 180, 210]
camera:
  width: 240
  height: 180
  fx: 220.0
  fy: 220.0
  cx: 119.5
  cy: 89.5
  depth_trunc_m: 5.0
  convention: opencv
reconstruction:
  backend: uniform
  volume_length_m: 2.0
  resolution: 128
  origin_m: [0.0, 0.0, 0.5]
  sdf_trunc_m: 0.06
views:
  - id: front
    split: integration
    eye: [0.95, 0.95, -0.3]
    target: [1.05, 0.95, 1.3]
  - id: left
    split: integration
    eye: [-0.6, 0.95, 0.3]
    target: [1.05, 0.95, 1.3]
  - id: right
    split: integration
    eye: [2.5, 0.95, 0.3]
    target: [1.05, 0.95, 1.3]
  - id: above
    split: integration
    eye: [0.95, -0.5, 0.6]
    target: [1.05, 0.95, 1.3]
  - id: novel_front_right
    split: held_out
    eye: [1.6, 0.55, -0.1]
    target: [1.05, 0.95, 1.3]
evaluation:
  depth_tolerance_m: 0.02
