[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wtumi-recon"
version = "0.1.0"
description = "Reusable RGB-D reconstruction infrastructure for WT-UMI Part 2"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "open3d>=0.19,<0.21", "PyYAML>=6,<7", "Pillow>=10", "plotly>=5.18,<8", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8.4"]
sim = ["mujoco>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
